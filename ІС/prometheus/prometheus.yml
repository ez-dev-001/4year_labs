global:
  scrape_interval: 5s

scrape_configs:
  - job_name: generator          # метрики SQL-операцій застосунку
    static_configs: [{ targets: ["generator:9100"] }]

  - job_name: postgres           # внутрішні метрики СУБД (pg_stat_database тощо)
    static_configs: [{ targets: ["postgres-exporter:9187"] }]

  - job_name: auth               # спроби входу
    static_configs: [{ targets: ["auth:9100"] }]

  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
