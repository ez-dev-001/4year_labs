# Єдина точка входу (http://localhost:8080). Усе, крім /auth/, доступне лише з валідною сесією.
events {}

http {
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 80;

        # сторінка входу/виходу - без перевірки
        location /auth/ {
            proxy_pass http://auth:8000;
        }

        # внутрішній запит перевірки сесії
        location = /_verify {
            internal;
            proxy_pass http://auth:8000/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location @login {
            return 302 /auth/login;
        }

        location /prometheus/ {
            auth_request /_verify;
            error_page 401 = @login;
            proxy_pass http://prometheus:9090/;
        }

        location / {
            auth_request /_verify;
            auth_request_set $user $upstream_http_x_user;
            error_page 401 = @login;

            # Grafana довіряє цьому заголовку (auth proxy); значення від клієнта перезаписується тут
            proxy_set_header X-WEBAUTH-USER $user;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://grafana:3000;
        }
    }
}
